name: CI → Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.archive/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── JOB 1: build + test ────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check . --reporter=github
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Verify deployment safety contract
        run: node --test tests/deploy-contract.test.mjs

      - name: Build (Next.js static export)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::out/ directory missing after build"
            exit 1
          fi
          echo "Build size: $(du -sh out | cut -f1)"
          echo "Files: $(find out -type f | wc -l)"

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests
        run: pnpm test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out/
          retention-days: 1

  # ── JOB 2: deploy (only if tests pass) ────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    environment:
      name: production
      url: https://zapleo.com

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to production
        run: |
          rsync -avz --delete \
            --filter='protect /_next/static/***' \
            --exclude='.well-known' \
            --exclude='legacy-*' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes" \
            out/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          curl -fsSL -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --output "$RUNNER_TEMP/cf-purge.json"
          jq -e '.success == true' "$RUNNER_TEMP/cf-purge.json" > /dev/null
          echo "✓ Cloudflare cache purged"

      - name: Explain missing cache credentials
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ZONE_ID == '' }}
        run: |
          echo "::warning::Cloudflare purge credentials are missing. Normal-URL verification must still pass; stale HTML is not a successful release."

      - name: Health check
        run: |
          for attempt in $(seq 1 62); do
            if curl -fsSL --max-time 30 https://zapleo.com/ --output "$RUNNER_TEMP/live-home.html" \
              && cmp -s out/index.html "$RUNNER_TEMP/live-home.html"; then
              echo "✓ Normal homepage URL serves the exact deployed HTML"
              exit 0
            fi
            echo "Waiting for normal-URL cache revalidation (attempt ${attempt}/62)"
            sleep 30
          done
          echo "::error::Normal homepage URL does not match this release. Check edge cache; query-string HTTP 200 is not acceptance proof."
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
