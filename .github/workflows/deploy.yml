name: CI → Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.archive/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── JOB 1: build + test ────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check . --reporter=github
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build (Next.js static export)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::out/ directory missing after build"
            exit 1
          fi
          echo "Build size: $(du -sh out | cut -f1)"
          echo "Files: $(find out -type f | wc -l)"

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests
        run: pnpm test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out/
          retention-days: 1

  # ── JOB 2: deploy (only if tests pass) ────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    environment:
      name: production
      url: https://zapleo.com

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to production
        run: |
          rsync -avz --delete \
            --exclude='.well-known' \
            --exclude='legacy-*' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes" \
            out/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -fsSL -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            && echo "✓ Cloudflare cache purged" \
            || echo "⚠ CF purge failed (non-fatal)"

      - name: Health check
        run: |
          sleep 3
          STATUS=$(curl -sSL -o /dev/null -w "%{http_code}" "https://zapleo.com/?ci=${{ github.sha }}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✓ Site responded HTTP 200"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
