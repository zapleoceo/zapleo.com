<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(9% 0.015 55)"/>
      <stop offset="100%" stop-color="oklch(14% 0.020 60)"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.75" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="oklch(60% 0.18 50 / 0.30)"/>
      <stop offset="60%" stop-color="oklch(60% 0.18 50 / 0)"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.25" cy="0.85" r="0.7">
      <stop offset="0%" stop-color="oklch(40% 0.12 30 / 0.30)"/>
      <stop offset="65%" stop-color="oklch(40% 0.12 30 / 0)"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.9 0 0 0 0 0.7 0 0 0 0 0.3 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" fill="url(#bloom2)"/>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.5"/>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="20" fill="oklch(70% 0.03 70)" letter-spacing="4">
    DNIPRO  →  WELIGAMA  →  VIETNAM  →  JAKARTA
  </text>

  <!-- big headline -->
  <text x="80" y="290" font-family="Georgia, 'Fraunces', serif" font-size="116" fill="oklch(95% 0.03 80)" font-weight="300" letter-spacing="-3">
    Operator first.
  </text>
  <text x="80" y="400" font-family="Georgia, 'Fraunces', serif" font-size="116" fill="oklch(82% 0.18 70)" font-style="italic" font-weight="300" letter-spacing="-3">
    Educator now.
  </text>

  <!-- under-line -->
  <text x="80" y="490" font-family="Georgia, serif" font-size="28" fill="oklch(70% 0.03 70)" font-style="italic">
    12 years of Ukrainian agency · Now running an IT academy in Jakarta.
  </text>

  <!-- wordmark bottom -->
  <text x="80" y="570" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22" fill="oklch(82% 0.18 70)" letter-spacing="6">
    ZAPLEO.COM
  </text>

  <!-- chapter marker right -->
  <text x="1120" y="570" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(50% 0.025 65)" text-anchor="end" letter-spacing="4">
    DMITRIY ZAPOROZHETS
  </text>
</svg>
